<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">

  <!-- Transparent background -->
  <rect width="256" height="256" fill="none"/>

  <!-- Ornament circle -->
  <circle cx="128" cy="140" r="100" fill="#0b3d0b" stroke="#0d4f0d" stroke-width="8"/>

  <!-- Ornament shine -->
  <ellipse cx="100" cy="110" rx="40" ry="20" fill="white" opacity="0.15"/>

  <!-- Ornament cap -->
  <rect x="108" y="40" width="40" height="30" rx="6" fill="#c0c0c0" stroke="#e0e0e0" stroke-width="3"/>
  <rect x="118" y="20" width="20" height="20" rx="4" fill="#d8d8d8"/>

  <!-- COUNTDOWN text -->
  <text x="128" y="155"
        font-family="Waltograph"
        font-size="34"
        fill="#d0d0d0"
        text-anchor="middle">
    COUNTDOWN
  </text>

</svg>
